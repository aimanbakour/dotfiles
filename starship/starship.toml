add_newline = false

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[](blue)'
# error_symbol = '[](red)'
[directory]
truncation_length = 3    # last 3 folders
truncate_to_repo = true  # start paths at the git repo root
truncation_symbol = "…/"

# Git 
[git_branch]
symbol = ""
format = '\([$symbol $branch]($style)\)'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'

[python]
# show just the env name, not the version/symbol
format = '\[[$symbol$virtualenv]($style)\]'
style = "yellow"
symbol = " "
detect_extensions = []
detect_files = []
detect_folders = []

# Suspended/background jobs
[jobs]
symbol = "✦"
format = ' [$symbol$number]($style)'
number_threshold = 2

[gcloud]
disabled = true

[cmd_duration]
disabled = true
